ts:  \n  1) a smart segment to target,  \n  2) a zone (where the interaction points are), and  \n  3) an offer or offer list to present.  \n- It can also include a *marketing score* (default 50) and other optional settings (for example, personalized offer attributes, learning, suppression, etc.).\n- When multiple offers are available, Interact uses scoring to choose between them (higher score wins; ties can be randomly broken).  \n\n*Eligibility rule (eligibility expression/predicate)*\n- A runtime expression used to control whether a treatment rule (and therefore its offer/offer list) is eligible.\n- An offer is only eligible if it is within its effective period (Effective\u2013Expiration) and/or the eligibility expression evaluates true at runtime.\n- You can write eligibility expressions directly in treatment rules (for example, checking an offer attribute like `offer.dynamic.ownProductX='yes'`).\n- If a treatment rule references an *offer list*, rule-level eligibility is evaluated first; if it returns false, the rule is excluded and the offer list is not considered from that rule.\n\nWhich one determines the final offer ranking?\n- *Eligibility rules determine inclusion/exclusion* (whether a rule/offer can participate).\n- *Final offer ranking is determined by score-based arbitration* after eligibility: Interact calculates a score for eligible treatment rules/offers (using the marketing score and optionally dynamic scoring/learning) and then sorts/returns offers based on the calculated score (with tie-breaking rules if scores are equal).\n\nSee *UnicaInteract26_1_0UserGuide_en_us.pdf* ([Page 88](https://doc.unica.com/products/interact/26_1_0/en_us/UnicaInteract26_1_0UserGuide_en_us.pdf#page=88), [Page 89](https://doc.unica.com/products/interact/26_1_0/en_us/UnicaInteract26_1_0UserGuide_en_us.pdf#page=89)) for more details.", "apiError": null, "retrievedContext": [], "expectedContext": ["Eligibility rules filter which offers a visitor qualifies for.", "Arbitratio ples of eligibility expressions, which are not in the expected output. This violates step 3 of the evaluation steps.", "lowerIsBetter": false}]}]}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);

        body += '<div class="sec"><h4>API error</h4><div class="err">' + esc(c.apiError) + '</div></div>';
      }
      body += '<div class="sec"><h4>Expected answer</h4><div class="txt">' + esc(c.expected || '(none)') + '</div></div>';
      body += '<div class="sec"><h4>Actual answer</h4><div class="txt">' + esc(c.actual || '(none)') + '</div></div>';
      body += '<div class="sec"><h4>Metrics</h4><table><tr><th>Metric</th><th>Score</th><th>Result</th><th>Reason</th></tr>' +
              metricRows(c) + '</table></div>';
      if (c.retrievedContext.length) {
        body += '<div class="sec"><h4>Retrieved context</h4>' + ctxList(c.retrievedContext) + '</div>';
      }
      if (c.expectedContext.length) {
        body += '<div class="sec"><h4>Ground-truth context</h4>' + ctxList(c.expectedContext) + '</div>';
      }
      return '<div class="row"><div class="rowhead"><span class="chev">&#9656;</span>' +
             '<span class="badge ' + (c.pass ? 'b-pass">PASS' : 'b-fail">FAIL') + '</span>' +
             '<span class="q">' + c.index + '. ' + esc(c.question) +
             '<div class="tags">' + tags + '</div></span></div>' +
             '<div class="body">' + body + '</div></div>';
    }).join('');
  };

  var apply = function () {
    var q = document.getElementById('q').value.toLowerCase();
    var st = document.getElementById('status').value;
    var cat = document.getElementById('cat').value;
    var ty = document.getElementById('type').value;
    render(D.cases.filter(function (c) {
      if (st === 'pass' && !c.pass) return false;
      if (st === 'fail' && c.pass) return false;
      if (cat && c.category !== cat) return false;
      if (ty && c.testType !== ty) return false;
      if (!q) return true;
      var hay = [c.question, c.expected, c.actual, c.apiError || ''].join(' ').toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
      return c.metrics.some(function (m) { return (m.detail || '').toLowerCase().indexOf(q) !== -1; });
    }));
  };

  ['q', 'status', 'cat', 'type'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', apply);
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var head = e.target.closest('.rowhead');
    if (head) head.parentNode.classList.toggle('open');
  });

  apply();
})();
</script>
</body>
</html>
