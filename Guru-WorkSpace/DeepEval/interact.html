ts, calculates scores, optionally personalizes attributes, and then returns offers.  \n\nAn *eligibility rule* (referred to as an **eligibility predicate/expression** inside a treatment rule) is the **criteria/expression evaluated at runtime** to decide whether a rule/offer is eligible. An offer is eligible only if it is within its effective period (Effective/Expiration dates) and/or the eligibility expression evaluates to true. You can write these eligibility expressions directly in treatment rules (for example, based on offer attributes or day of week) to control targeting outside interactive flowcharts.\n\nWhich determines the final offer ranking?\n- **Eligibility predicates determine whether offers/rules are included at all** (eligible vs. excluded).\n- **Final ranking is determined by score** after eligibility: Interact calculates a score for each eligible treatment rule/offer (using marketing score and optionally dynamic scoring/learning), then offers are sorted based on the calculated score and the top requested offers are returned. If multiple offers have the same score, Interact can break ties randomly (configurable).\n\n[UnicaInteract26_1_0UserGuide_en_us.pdf](https://doc.unica.com/products/interact/26_1_0/en_us/UnicaInteract26_1_0UserGuide_en_us.pdf#page=88) (see the document for more details)", "apiError": null, "retrievedContext": [], "expectedContext": ["Eligibility rules filter which offers a visitor qualifies for.", "Arbitration (treatment) logic ranks eligible offers using scores, priorities, or self-learning models to pick the final offer."], "category": "interact", "difficulty": "medium", "testType": "multi_document", "pass": true, "metrics": [{"key": "contextual_precision", "label": "Contextual Precision", "state": "na", "detail": "API response did not expose retrieved context"}, {"key": "contextual_recall", "label": "Contextual Recall", "state": "na", "detail": "API response did not expose retrieved context"}, {"key": "contextual_relevancy", "la               metricRows(c) + '</table></div>';
      if (c.retrievedContext.length) {
        body += '<div class="sec"><h4>Retrieved context</h4>' + ctxList(c.retrievedContext) + '</div>';
      }
      if (c.expectedContext.length) {
        body += '<div class="sec"><h4>Ground-truth context</h4>' + ctxList(c.expectedContext) + '</div>';
      }
      return '<div class="row"><div class="rowhead"><span class="chev">&#9656;</span>' +
             '<span class="badge ' + (c.pass ? 'b-pass">PASS' : 'b-fail">FAIL') + '</span>' +
             '<span class="q">' + c.index + '. ' + esc(c.question) +
             '<div class="tags">' + tags + '</div></span></div>' +
             '<div class="body">' + body + '</div></div>';
    }).join('');
  };

  var apply = function () {
    var q = document.getElementById('q').value.toLowerCase();
    var st = document.getElementById('status').value;
    var cat = document.getElementById('cat').value;
    var ty = document.getElementById('type').value;
    render(D.cases.filter(function (c) {
      if (st === 'pass' && !c.pass) return false;
      if (st === 'fail' && c.pass) return false;
      if (cat && c.category !== cat) return false;
      if (ty && c.testType !== ty) return false;
      if (!q) return true;
      var hay = [c.question, c.expected, c.actual, c.apiError || ''].join(' ').toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
      return c.metrics.some(function (m) { return (m.detail || '').toLowerCase().indexOf(q) !== -1; });
    }));
  };

  ['q', 'status', 'cat', 'type'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', apply);
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var head = e.target.closest('.rowhead');
    if (head) head.parentNode.classList.toggle('open');
  });

  apply();
})();
</script>
</body>
</html>
